[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "erm"
version = "0.1.0"
description = "Enterprise Risk Management Framework for a fictional Islamic bank (PT Amanah Syariah Bank)"
requires-python = ">=3.11"
dependencies = ["pandas", "numpy", "pyyaml", "openpyxl", "matplotlib", "reportlab", "pdfplumber", "pillow"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
